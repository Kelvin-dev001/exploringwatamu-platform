# Render Blueprint — deploys the ExploringWatamu backend API.
# In Render: New + -> Blueprint -> connect this repo. After the first deploy,
# fill in the secrets marked "sync: false" in the service's Environment tab.
services:
  - type: web
    name: exploringwatamu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # A strong secret is generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: SMTP_PORT
        value: "587"
      # --- Secrets: set these in the Render dashboard (never in code) ---
      - key: MONGODB_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
