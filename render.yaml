# Render Blueprint — deploys the ExploringWatamu backend API.
# In Render: New + -> Blueprint -> connect this repo. After the first deploy,
# fill in the secrets marked "sync: false" in the service's Environment tab.
# A service created by hand in the dashboard does not read this file: copy
# the build command and variables over yourself (see DEPLOYMENT.md).
services:
  - type: web
    name: exploringwatamu-api
    runtime: node
    plan: free
    rootDir: backend
    # Exactly the versions in package-lock.json, without test tooling.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Liveness only (no database call): a database blip must not make Render
    # restart a healthy server. Readiness is /api/health/ready (uptime monitor).
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # A strong secret is generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: SMTP_PORT
        value: "587"
      # Public business WhatsApp number (+254…) for links in quote emails/PDFs.
      # Not a secret, but set per deployment; empty = no WhatsApp links.
      - key: WHATSAPP_NUMBER
        sync: false
      # Requests reach the app through one proxy: req.ip (rate limits) is the visitor.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_ENVIRONMENT
        value: production
      # --- Secrets: set these in the Render dashboard (never in code) ---
      - key: MONGODB_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Error monitoring (optional; off while empty). The release is taken from
      # RENDER_GIT_COMMIT automatically.
      - key: SENTRY_DSN
        sync: false

