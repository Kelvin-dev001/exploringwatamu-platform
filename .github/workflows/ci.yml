name: CI

# Runs every check on pull requests to main and on pushes to main. No secrets
# are needed: the API tests use an in-memory MongoDB, email/SMS/Cloudinary stay
# unconfigured, and the browser smoke test runs against local builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend — unit + E2E
    # Pinned: mongodb-memory-server picks its MongoDB binary by OS release, and
    # ubuntu-latest moves to a new Ubuntu without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache the MongoDB binary used by the E2E tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests (in-memory MongoDB)
        run: npm run test:e2e

  website:
    name: Website — lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client-vite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin:
    name: Admin — lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-vite/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    name: Browser smoke test — quote journey
    # Only worth running once each app passes on its own.
    needs: [backend, website, admin]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client-vite/package-lock.json
            admin-vite/package-lock.json
            e2e/package-lock.json
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Install the three apps and the smoke tests
        run: |
          npm ci --prefix backend
          npm ci --prefix client-vite
          npm ci --prefix admin-vite
          npm ci --prefix e2e
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the smoke test
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
